<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="{{ url_for('auth.index') }}">TaskFlow</a>
            <div class="ms-auto d-flex align-items-center">
                {% if current_user.is_authenticated %}
                    <span class="text-light me-3">Привіт, <strong>{{ current_user.username }}</strong></span>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger btn-sm">Вийти</a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-light btn-sm me-2">Вхід</a>
                    <a href="{{ url_for('auth.register') }}" class="btn btn-success btn-sm">Реєстрація</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
